                  <h3 className="font-bold text-base text-slate-900">Catálogo Atual ({products.length} peças)</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 uppercase border-b">
                        <tr>
                          <th className="p-2.5">Foto</th>
                          <th className="p-2.5">Nome / Cód</th>
                          <th className="p-2.5">Custo</th>
                          <th className="p-2.5">Venda</th>
                          <th className="p-2.5">Estoque</th>
                          <th className="p-2.5 text-center">Ação</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {products.map(p => (
                          <tr key={p.id} className="hover:bg-slate-50">
                            <td className="p-2.5">
                              <img src={p.image} className="w-10 h-10 object-cover rounded" alt={p.name} />
[25/09/2026 11:11] Sandro Luz: </td>
                            <td className="p-2.5 font-bold text-slate-800">
                              {p.name}
                              <span className="block font-normal text-slate-400 font-mono text-[10px]">Cód: {p.barcode}</span>
                            </td>
                            <td className="p-2.5 text-slate-500">R$ {p.costPrice.toFixed(2)}</td>
                            <td className="p-2.5 font-bold text-indigo-600">R$ {(p.fixedPrice || p.retailPrice).toFixed(2)}</td>
                            <td className="p-2.5">
                              <span className={`px-2 py-0.5 rounded font-bold ${p.stock > 0 ? 'bg-slate-100 text-slate-700' : 'bg-rose-100 text-rose-700'}`}>
                                {p.stock} un
                              </span>
                            </td>
                            <td className="p-2.5 text-center">
                              <button 
                                onClick={() => {
                                  if (confirm('Deseja excluir este item do catálogo?')) {
                                    setProducts(products.filter(item => item.id !== p.id));
                                  }
                                }}
                                className="text-rose-500 hover:text-rose-700 font-bold"
                              >
                                Excluir
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* ABA 3: CONFIGURAÇÕES DA LOJA */}
            {activeTab === 'settings' && (
              <div className="max-w-xl mx-auto bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <h3 className="font-bold text-lg text-slate-900 border-b pb-3">Informações da Loja</h3>
                
                <div>
                  <label className="text-xs font-bold text-slate-700">Nome da Loja</label>
                  <input 
                    type="text" 
                    value={storeConfig.name}
                    onChange={e => setStoreConfig({ ...storeConfig, name: e.target.value })}
                    className="w-full mt-1 p-2.5 border border-slate-300 rounded-lg text-sm"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs font-bold text-slate-700">WhatsApp / Telefone</label>
                    <input 
                      type="text" 
                      value={storeConfig.phone}
                      onChange={e => setStoreConfig({ ...storeConfig, phone: e.target.value })}
                      className="w-full mt-1 p-2.5 border border-slate-300 rounded-lg text-sm"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700">E-mail Comercial</label>
                    <input 
                      type="email" 
                      value={storeConfig.email}
                      onChange={e => setStoreConfig({ ...storeConfig, email: e.target.value })}
                      className="w-full mt-1 p-2.5 border border-slate-300 rounded-lg text-sm"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-xs font-bold text-slate-700">URL do Logotipo</label>
                  <input 
                    type="url" 
                    value={storeConfig.logoUrl}
                    onChange={e => setStoreConfig({ ...storeConfig, logoUrl: e.target.value })}
                    className="w-full mt-1 p-2.5 border border-slate-300 rounded-lg text-sm"
                  />
                </div>

                <div>
[25/09/2026 11:11] Sandro Luz: <label className="text-xs font-bold text-slate-700">Chave Pix da Loja (Para clientes pagarem)</label>
                  <input 
                    type="text" 
                    value={storeConfig.pixKey}
                    onChange={e => setStoreConfig({ ...storeConfig, pixKey: e.target.value })}
                    className="w-full mt-1 p-2.5 border border-slate-300 rounded-lg text-sm"
                  />
                </div>

                <button 
                  onClick={() => alert('Dados da loja atualizados com sucesso!')}
                  className="w-full py-3 bg-slate-900 text-white rounded-lg font-bold text-sm hover:bg-slate-800 transition-colors"
                >
                  Salvar Alterações
                </button>
              </div>
            )}
          </main>

          {/* MODAL MASTER (SEU ACESSO COM SENHA) */}
          {showMasterModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-base text-slate-900">Gerenciador Master (Você)</h3>
                  <button onClick={() => setShowMasterModal(false)} className="text-slate-400 font-bold hover:text-slate-700">✕</button>
                </div>

                {!isMasterAuthenticated ? (
                  <form onSubmit={handleLoginMaster} className="space-y-3">
                    <label className="text-xs font-bold text-slate-700">Digite a senha de administrador:</label>
                    <input 
                      type="password" 
                      placeholder="Digite a senha..." 
                      value={enteredPin}
                      onChange={e => setEnteredPin(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:border-indigo-600"
                      autoFocus
                    />
                    <button type="submit" className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-lg text-sm hover:bg-indigo-700">
                      Entrar no Painel Master
                    </button>
                  </form>
                ) : (
                  <div className="space-y-3 text-xs">
                    <div className="p-3 bg-slate-50 border rounded-lg space-y-1">
                      <p><strong className="text-slate-700">Validade Atual:</strong> {licenseExpiry}</p>
                      <p><strong className="text-slate-700">Status:</strong> {isManuallyBlocked ? '🔴 Bloqueado' : '🟢 Ativo'}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <button 
                        onClick={() => addDaysToLicense(30)}
                        className="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold"
                      >
                        +30 Dias (Renovar)
                      </button>
                      <button 
                        onClick={() => {
                          const next = !isManuallyBlocked;
                          setIsManuallyBlocked(next);
                          alert(next ? 'Loja bloqueada!' : 'Loja desbloqueada!');
                        }}
                        className={`py-2.5 rounded-lg font-bold ${!isManuallyBlocked ? 'bg-rose-600 text-white hover:bg-rose-700' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
                      >
                        {!isManuallyBlocked ? 'Bloquear Loja' : 'Desbloquear'}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
